name: Validate Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-validation:
    name: pages-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate landing assets and translations
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          root = Path("docs")
          html = (root / "index.html").read_text(encoding="utf-8")

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag in {"img", "script", "link"}:
                      source = values.get("src") or values.get("href")
                      if source:
                          self.assets.append(source)
                  if tag == "a" and values.get("href"):
                      self.links.append(values["href"])
                  if "data-en" in values or "data-es" in values:
                      if "data-en" not in values or "data-es" not in values:
                          raise AssertionError(f"translation pair missing on {tag}")

          checker = Checker()
          checker.feed(html)
          for source in checker.assets:
              parsed = urlparse(source)
              if parsed.scheme or source.startswith("#"):
                  continue
              if not (root / source.split("#", 1)[0]).is_file():
                  raise AssertionError(f"missing landing asset: {source}")
          release_base = "https://github.com/ChristianM023/notify-sound/releases/download/"
          release_links = [
              link for link in checker.links if link.startswith(release_base)
          ]
          required = {
              link for link in release_links
              if link.endswith(".deb") or link.endswith(".deb.sha256")
          }
          if not any(link.endswith(".deb") for link in required):
              raise AssertionError("Debian release link is missing")
          if not any(link.endswith(".deb.sha256") for link in required):
              raise AssertionError("Debian checksum link is missing")
          for link in required:
              request = Request(
                  link,
                  method="HEAD",
                  headers={"User-Agent": "notify-sound-pages-validation"},
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      if response.status != 200:
                          raise AssertionError(
                              f"unexpected HTTP status {response.status}: {link}"
                          )
              except HTTPError as error:
                  raise AssertionError(
                      f"release asset unavailable ({error.code}): {link}"
                  ) from error
          print(f"Pages validation ok: {len(checker.assets)} assets, {len(checker.links)} links")
          PY
