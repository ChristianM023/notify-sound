name: Build release assets

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to rebuild and attach assets for
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: release-assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Build reproducible package and provenance
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          commit="$(git rev-parse "$tag^{commit}")"
          version="$(python3 -c 'import re; import pathlib; text=pathlib.Path("notify_sound/__init__.py").read_text(); print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", text).group(1))')"
          test "v$version" = "$tag"
          epoch="$(git show -s --format=%ct "$commit")"
          rm -rf dist/release-a dist/release-b
          SOURCE_DATE_EPOCH="$epoch" OUT_DIR=dist/release-a ./build-deb.sh
          SOURCE_DATE_EPOCH="$epoch" OUT_DIR=dist/release-b ./build-deb.sh
          package="$(find dist/release-a -maxdepth 1 -name 'notify-sound_*_all.deb' -type f -print -quit)"
          other="dist/release-b/$(basename "$package")"
          cmp "$package" "$other"
          echo "PACKAGE_PATH=$package" >> "$GITHUB_ENV"
          (cd "$(dirname "$package")" && sha256sum "$(basename "$package")" > "$(basename "$package").sha256")
          package_sha256="$(sha256sum "$package" | cut -d ' ' -f 1)"
          package_size="$(stat -c '%s' "$package")"
          dpkg_deb_version="$(dpkg-deb --version)"
          export RELEASE_TAG="$tag" RELEASE_COMMIT="$commit" SOURCE_DATE_EPOCH="$epoch"
          export PACKAGE_NAME="$(basename "$package")" PACKAGE_SHA256="$package_sha256"
          export PACKAGE_SIZE="$package_size" DPKG_DEB_VERSION="$dpkg_deb_version"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["RELEASE_COMMIT"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "package": os.environ["PACKAGE_NAME"],
              "sha256": os.environ["PACKAGE_SHA256"],
              "size": int(os.environ["PACKAGE_SIZE"]),
              "dpkg_deb": os.environ["DPKG_DEB_VERSION"],
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
          }
          output = Path("dist/release-a") / f"{data['package']}.buildinfo.json"
          output.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "NotifySound $tag" --generate-notes
          fi
          gh release upload "$tag" \
            "$package" \
            "$package.sha256" \
            "dist/release-a/${PACKAGE_NAME}.buildinfo.json" \
            --clobber
      - name: Attest Debian package
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: ${{ env.PACKAGE_PATH }}
